[project]
name = "financial-prediction"
version = "0.1.0"
description = "Next-day price change forecasting service with an automated MLOps pipeline"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "boto3>=1.35.0",
    "dvc==3.67.1",
    "dvc-s3==3.3.0",
    "evidently==0.7.23",
    "exchange-calendars>=4.13.2",
    "fastapi>=0.143.0",
    "httpx2>=2.13.1",
    "mlflow>=3.17.2",
    "pandas>=3.0.6,<3.1",
    "prometheus-client>=0.26.0",
    "prometheus-fastapi-instrumentator>=8.1.0",
    "psycopg[binary]>=3.3.6",
    "pyyaml==6.0.3",
    "scikit-learn>=1.9.1",
    "sqlalchemy>=2.1.4",
    "uvicorn>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "forecasting"

[dependency-groups]
dev = [
    "pandas-stubs>=3.0.5.260914",
    "pyright[nodejs]>=1.1.414",
    "pytest>=9.1.1",
    "pytest-xdist>=3.8.0",
    "ruff>=0.16.10",
    "strictdoc>=0.30.4",
]
webapp = [
    "httpx2>=2.13.1",
    "pandas>=3.0.6",
    "streamlit>=1.66.1",
]

[tool.uv]
default-groups = ["dev", "webapp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers -rA"
markers = [
    "acceptance: black-box test of a requirement; red until the feature is built",
    "eodhd: contract test of EODHD; calls it with your own key from .env",
    "integration: test of our code against the real database",
]

[tool.pyright]
include = ["src", "tests", "webapp"]

[tool.ruff.lint]
select = ["E", "F", "I", "D"]

[tool.ruff.lint.pydocstyle]
convention = "google"
