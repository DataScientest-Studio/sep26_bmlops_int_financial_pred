[project]
name = "financial-prediction"
version = "0.1.0"
description = "Next-day price change forecasting service with an automated MLOps pipeline"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "exchange-calendars>=4.13.2",
    "fastapi>=0.143.0",
    "pandas>=3.0.6",
    "psycopg[binary]>=3.3.6",
    "scikit-learn>=1.9.1",
    "sqlalchemy>=2.1.4",
    "uvicorn>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "forecasting"

[dependency-groups]
dev = [
    "httpx2>=2.13.1",
    "pytest>=9.1.1",
    "pytest-xdist>=3.8.0",
    "ruff>=0.16.10",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers -rA"
markers = ["acceptance: black-box test of a requirement; red until the feature is built"]

[tool.ruff.lint]
select = ["E", "F", "I", "D"]

[tool.ruff.lint.pydocstyle]
convention = "google"
