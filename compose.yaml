# Settings of the services that run from the project image.
x-project: &project
  build:
    context: .
    args:
      CODE_VERSION: ${CODE_VERSION:-unknown}
  image: financial-prediction:local
  env_file: .env
  # Inside Compose the database and the MLflow server are reached by their service
  # names and their own ports.
  environment:
    POSTGRES_HOST: db
    POSTGRES_PORT: "5432"
    MLFLOW_TRACKING_URI: http://mlflow:5000
    AWS_ACCESS_KEY_ID: ${OBJECT_STORE_USER:?set in .env}
    AWS_SECRET_ACCESS_KEY: ${OBJECT_STORE_PASSWORD:?set in .env}
  # A missing models or datasets folder stops the start, so Docker never creates
  # it as root.
  volumes:
    - type: bind
      source: ./models
      target: /app/models
      bind:
        create_host_path: false
    - type: bind
      source: ./datasets
      target: /app/datasets
      bind:
        create_host_path: false
  depends_on:
    db:
      condition: service_healthy
    db-tables:
      condition: service_completed_successfully
    object-store:
      condition: service_healthy

# Settings of the Airflow services: only what Airflow and its pipelines read.
x-airflow: &airflow
  image: apache/airflow:3.3.2-python3.12
  environment:
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:${AIRFLOW_DB_PASSWORD:?set in .env}@db:5432/airflow
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
    AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://airflow-apiserver:8080/execution/
    AIRFLOW__API_AUTH__JWT_SECRET: ${AIRFLOW_JWT_SECRET:?set in .env}
    AIRFLOW__CORE__AUTH_MANAGER: airflow.api_fastapi.auth.managers.simple.simple_auth_manager.SimpleAuthManager
    AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_USERS: admin:admin
    AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_PASSWORDS_FILE: /opt/airflow/passwords.json
    AIRFLOW_ADMIN_PASSWORD: ${AIRFLOW_ADMIN_PASSWORD:?set in .env}
    # Read by the daily update pipeline.
    FINAL_DELAY_MINUTES: ${FINAL_DELAY_MINUTES:?set in .env}
    # Read by the replay pipeline.
    REPLAY_INTERVAL_SECONDS: ${REPLAY_INTERVAL_SECONDS:?set in .env}
  volumes:
    - ./airflow/dags:/opt/airflow/dags:ro
    - airflow-logs:/opt/airflow/logs

services:
  db:
    image: postgres:18.6-bookworm
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?set in .env}
      POSTGRES_USER: ${POSTGRES_USER:?set in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:?set in .env}:5432"
    volumes:
      - db-data:/var/lib/postgresql
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 2s
      timeout: 5s
      retries: 15

  # Runs one project command and exits, for example through `make load`; left out of
  # `docker compose up`.
  commands:
    <<: *project
    profiles: [commands]
    entrypoint: [run-as-owner, python, -m, forecasting.commands]
    depends_on:
      db:
        condition: service_healthy
      db-tables:
        condition: service_completed_successfully
      object-store:
        condition: service_healthy
      mlflow:
        condition: service_healthy

  api:
    <<: *project
    # Listens on every address inside its container; the host publishes it on 127.0.0.1.
    command: [uvicorn, "forecasting.api.app:app", --host, 0.0.0.0, --port, "8000"]
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen("http://localhost:8000/health")
      interval: 2s
      timeout: 5s
      retries: 15
    depends_on:
      db:
        condition: service_healthy
      db-tables:
        condition: service_completed_successfully
      mlflow:
        condition: service_healthy

  # Runs the load and the replay for the scheduled pipelines; reachable only inside
  # Compose, so no port is published on the host.
  data:
    <<: *project
    command: [uvicorn, "forecasting.data_service:app", --host, 0.0.0.0, --port, "8000"]
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen("http://localhost:8000/health")
      interval: 2s
      timeout: 5s
      retries: 15

  # Holds the model files for MLflow and the dataset copies for DVC; reachable only
  # inside Compose on its S3 port 8333, so no port is published on the host.
  object-store:
    image: chrislusf/seaweedfs:4.48
    command: [mini, -dir=/data, "-bucket=mlflow,datasets"]
    environment:
      AWS_ACCESS_KEY_ID: ${OBJECT_STORE_USER:?set in .env}
      AWS_SECRET_ACCESS_KEY: ${OBJECT_STORE_PASSWORD:?set in .env}
    volumes:
      - object-store-data:/data
    healthcheck:
      test: [CMD, nc, -z, 127.0.0.1, "8333"]
      interval: 2s
      timeout: 5s
      retries: 15

  # Creates the project database's tables from db/init when missing, on every start.
  db-tables:
    image: postgres:18.6-bookworm
    environment:
      PGHOST: db
      PGUSER: ${POSTGRES_USER:?set in .env}
      PGPASSWORD: ${POSTGRES_PASSWORD:?set in .env}
      PGDATABASE: ${POSTGRES_DB:?set in .env}
    command: [sh, -c, cat /db/init/*.sql | psql -v ON_ERROR_STOP=1]
    volumes:
      - ./db/init:/db/init:ro
    depends_on:
      db:
        condition: service_healthy

  # Creates MLflow's database and its login on the project's server when missing.
  mlflow-database:
    image: postgres:18.6-bookworm
    environment:
      PGHOST: db
      PGUSER: ${POSTGRES_USER:?set in .env}
      PGPASSWORD: ${POSTGRES_PASSWORD:?set in .env}
      PGDATABASE: ${POSTGRES_DB:?set in .env}
      MLFLOW_DB_PASSWORD: ${MLFLOW_DB_PASSWORD:?set in .env}
    command:
      - sh
      - -c
      - >-
        psql -v ON_ERROR_STOP=1 -v name=mlflow -v password="$$MLFLOW_DB_PASSWORD"
        -f /db/tools/create-database.sql
    volumes:
      - ./db/tools/create-database.sql:/db/tools/create-database.sql:ro
    depends_on:
      db:
        condition: service_healthy

  # The MLflow server and its page on 127.0.0.1: stores run and model records in
  # PostgreSQL and model files in the object store.
  mlflow:
    image: financial-prediction:local
    build:
      context: .
      args:
        CODE_VERSION: ${CODE_VERSION:-unknown}
    # The image's entrypoint run-as-owner looks up the owner of /app/models; MLflow
    # mounts no project folder and writes no host files, so it starts directly.
    entrypoint: []
    command:
      - mlflow
      - server
      - --host
      - 0.0.0.0
      - --port
      - "5000"
      - --backend-store-uri
      - postgresql+psycopg://mlflow:${MLFLOW_DB_PASSWORD:?set in .env}@db:5432/mlflow
      - --artifacts-destination
      - s3://mlflow
      - --allowed-hosts
      - mlflow:5000,localhost:*,127.0.0.1:*
    environment:
      MLFLOW_S3_ENDPOINT_URL: http://object-store:8333
      AWS_ACCESS_KEY_ID: ${OBJECT_STORE_USER:?set in .env}
      AWS_SECRET_ACCESS_KEY: ${OBJECT_STORE_PASSWORD:?set in .env}
    ports:
      - "127.0.0.1:${MLFLOW_PORT:?set in .env}:5000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen("http://localhost:5000/health")
      interval: 2s
      timeout: 5s
      retries: 15
    depends_on:
      mlflow-database:
        condition: service_completed_successfully
      object-store:
        condition: service_healthy

  # Creates Airflow's database and its login on the project's server when missing.
  airflow-database:
    image: postgres:18.6-bookworm
    environment:
      PGHOST: db
      PGUSER: ${POSTGRES_USER:?set in .env}
      PGPASSWORD: ${POSTGRES_PASSWORD:?set in .env}
      PGDATABASE: ${POSTGRES_DB:?set in .env}
      AIRFLOW_DB_PASSWORD: ${AIRFLOW_DB_PASSWORD:?set in .env}
    command:
      - sh
      - -c
      - >-
        psql -v ON_ERROR_STOP=1 -v name=airflow -v password="$$AIRFLOW_DB_PASSWORD"
        -f /db/tools/create-database.sql
    volumes:
      - ./db/tools/create-database.sql:/db/tools/create-database.sql:ro
    depends_on:
      db:
        condition: service_healthy

  # Creates or upgrades Airflow's tables, then exits.
  airflow-init:
    <<: *airflow
    command: [db, migrate]
    depends_on:
      airflow-database:
        condition: service_completed_successfully

  # The Airflow page on 127.0.0.1: writes the admin password from .env into the file
  # Airflow's login reads, then starts.
  airflow-apiserver:
    <<: *airflow
    command:
      - bash
      - -c
      - |
        set -e
        python - <<'EOF'
        import json
        import os

        path = os.environ["AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_PASSWORDS_FILE"]
        with open(path, "w") as file:
            json.dump({"admin": os.environ["AIRFLOW_ADMIN_PASSWORD"]}, file)
        EOF
        exec airflow api-server
    ports:
      - "127.0.0.1:${AIRFLOW_PORT:?set in .env}:8080"
    # Airflow takes longer to start than the project's services: up to 2.5 minutes.
    healthcheck:
      test: [CMD, curl, --fail, http://localhost:8080/api/v2/monitor/health]
      interval: 5s
      timeout: 10s
      retries: 30
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  # Starts the pipeline runs on their schedule and runs their tasks.
  airflow-scheduler:
    <<: *airflow
    command: [scheduler]
    healthcheck:
      test:
        - CMD-SHELL
        - airflow jobs check --job-type SchedulerJob --hostname "$${HOSTNAME}"
      interval: 5s
      timeout: 10s
      retries: 30
    depends_on:
      airflow-init:
        condition: service_completed_successfully
      data:
        condition: service_healthy

  # Reads the pipelines in airflow/dags.
  airflow-dag-processor:
    <<: *airflow
    command: [dag-processor]
    healthcheck:
      test:
        - CMD-SHELL
        - airflow jobs check --job-type DagProcessorJob --hostname "$${HOSTNAME}"
      interval: 5s
      timeout: 10s
      retries: 30
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  # Collects the API's numbers; reachable only inside Compose, where Grafana reads
  # them, so no port is published on the host.
  prometheus:
    image: prom/prometheus:v3.15.0
    volumes:
      - ./prometheus:/etc/prometheus:ro
      - prometheus-data:/prometheus
    healthcheck:
      test: [CMD, wget, --quiet, --spider, http://localhost:9090/-/ready]
      interval: 2s
      timeout: 5s
      retries: 15

  # The Grafana page on 127.0.0.1: shows the numbers Prometheus collected. Its data
  # source and dashboards come from grafana/, so it keeps no volume of its own.
  grafana:
    image: grafana/grafana:13.2.4
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set in .env}
      # No usage reports, update checks, news feed or Gravatar images.
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
      GF_SECURITY_DISABLE_GRAVATAR: "true"
      # Use the Prometheus plugin bundled with the image: no download at start.
      GF_PLUGINS_PREINSTALL_AUTO_UPDATE: "false"
      # Skip the default plugins this project does not use.
      GF_PLUGINS_DISABLE_PLUGINS: >-
        elasticsearch,grafana-advisor-app,grafana-exploretraces-app,
        grafana-lokiexplore-app,grafana-metricsdrilldown-app,
        grafana-postgresql-datasource,grafana-pyroscope-app,
        grafana-pyroscope-datasource,influxdb,jaeger,loki,mssql,mysql,opentsdb,
        stackdriver,tempo,zipkin
    ports:
      - "127.0.0.1:${GRAFANA_PORT:?set in .env}:3000"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    healthcheck:
      test: [CMD, curl, --fail, http://localhost:3000/api/health]
      interval: 2s
      timeout: 5s
      retries: 15
    depends_on:
      prometheus:
        condition: service_healthy

volumes:
  db-data:
  object-store-data:
  airflow-logs:
  prometheus-data:
