apiVersion: 1

groups:
  - orgId: 1
    name: api
    # The folder of the dashboards, found by its title.
    folder: Financial forecasting
    # How often Grafana checks the alert rules.
    interval: 1m
    rules:
      - uid: api-error-rate
        title: API error rate
        # The rule fires when the step "threshold" is true.
        condition: threshold
        data:
          - refId: error_rate
            datasourceUid: prometheus
            relativeTimeRange: {from: 300, to: 0}
            model:
              expr: api:error_ratio:rate5m
              instant: true
          - refId: threshold
            datasourceUid: __expr__
            model:
              type: threshold
              expression: error_rate
              # The error rate above which the rule fires.
              conditions: [{evaluator: {type: gt, params: [0.05]}}]
        # How long the threshold must stay crossed before the alert fires.
        for: 5m
        # No requests means no error rate, not a fault.
        noDataState: OK
        execErrState: Error
        annotations:
          summary: The API's error rate is above its threshold.

      - uid: data-not-fresh
        title: Data not fresh
        # The rule fires when the step "threshold" is true.
        condition: threshold
        data:
          - refId: days_behind
            datasourceUid: prometheus
            relativeTimeRange: {from: 300, to: 0}
            model:
              expr: trading_days_behind
              instant: true
          - refId: threshold
            datasourceUid: __expr__
            model:
              type: threshold
              expression: days_behind
              # The number of trading days behind above which the rule fires.
              conditions: [{evaluator: {type: gt, params: [0]}}]
        # Fires at the first check: a trading day behind needs no waiting.
        for: 0s
        # No number of trading days behind means nothing to measure, not a fault.
        noDataState: OK
        execErrState: Error
        annotations:
          summary: "{{ $labels.symbol }} is trading days behind its latest load."

      - uid: daily-update-missed
        title: Daily update missed
        # The rule fires when the step "threshold" is true.
        condition: threshold
        data:
          - refId: updates_missed
            datasourceUid: prometheus
            relativeTimeRange: {from: 300, to: 0}
            model:
              expr: daily_updates_missed
              instant: true
          - refId: threshold
            datasourceUid: __expr__
            model:
              type: threshold
              expression: updates_missed
              # The number of missed daily updates above which the rule fires.
              conditions: [{evaluator: {type: gt, params: [0]}}]
        # Fires at the first check: a daily update counts as missed only once its load
        # limit has passed.
        for: 0s
        # No number of missed daily updates means nothing to measure, not a fault.
        noDataState: OK
        execErrState: Error
        annotations:
          summary: A scheduled daily update passed its load limit without a load.
