# How the drift checks compare a security's latest stored trading days with the days up
# to its latest training. The ranges and the reasons for them are in
# src/forecasting/config.py.

# How many of the latest stored trading days each drift check compares.
drift_window_days = 60
# How many stored trading days pass between two checks of a security's forecasts for
# drift.
prediction_drift_check_interval_days = 5
# A check finds drift when its p-value (0 to 1) is at or below this value.
drift_p_value_threshold = 0.01
