# How the drift checks compare a security's latest days with the earlier days. The
# ranges and the reasons for them are in src/forecasting/config.py.

# How many of the latest days each drift check looks at: stored trading days for the
# feature drift check, days with a scheduled forecast for the prediction drift check.
# Each check compares them with the earlier days.
# The feature drift check does not run while fewer than 20 daily changes lie before its
# window.
drift_window_days = 60
# How many stored trading days pass between two prediction drift checks of a security.
prediction_drift_check_interval_days = 5
# A check finds drift when its p-value (0 to 1) is at or below this value.
drift_p_value_threshold = 0.01
