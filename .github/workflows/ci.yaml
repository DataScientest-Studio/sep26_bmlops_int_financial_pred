name: CI

on: push

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.2.0
      - run: make setup
      - run: make lint
      # make test reads .env, which is never committed; the example values serve here.
      - run: cp .env.example .env
      - run: make test
